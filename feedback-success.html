<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEPHRA — Submission Received</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
</head>
<body>

    <header class="navbar fixed-top">
        <div class="nav-wrap">
            <nav class="nav-left">
                <a href="index.html" class="nav-item">Home</a>
                <a href="history.html" class="nav-item">History</a>
                <a href="feedback.html" class="nav-item active">Feedback</a>
                <a href="contact.html" class="nav-item">Contact</a>
            </nav>
            <a href="index.html" class="nav-brand">Zephra</a>
            <div class="nav-right">
                <a href="signin.html" class="nav-item">Sign In</a>
                <a href="saved.html" class="nav-item">Saved</a>
            </div>
        </div>
    </header>

    <main class="container py-5" style="margin-top: 100px;">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-5 shadow-sm border-0 rounded-4">
                    <div class="text-center mb-4">
                        <span class="display-4">🏸</span>
                        <h2 class="fw-bold mt-2" style="color: #1a362d;">Feedback Received!</h2>
                        <p class="text-muted">Here is a copy of the details you submitted to our team:</p>
                    </div>

                    <!-- SUBMITTED DATA DISPLAY BOX -->
                    <div class="p-4 border rounded-3 bg-light mb-4" id="submittedDataBox">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <strong>Topic:</strong> <span id="displayTopic" class="text-secondary">-</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Experience Rating:</strong> <span id="displaySentiment" class="text-secondary">-</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Name:</strong> <span id="displayName" class="text-secondary">-</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Email:</strong> <span id="displayEmail" class="text-secondary">-</span>
                            </div>
                            <div class="col-12">
                                <strong>Message / Notes:</strong>
                                <p id="displayMessage" class="mt-1 p-3 bg-white border rounded text-secondary mb-0">-</p>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-3">
                        <a href="index.html" class="btn btn-primary px-4 py-2">Back to Home</a>
                        <a href="feedback.html" class="btn btn-outline-secondary px-4 py-2">Send Another Note</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="feedback.js"></script>
    <script>
        // Read saved submission data from localStorage and display it on screen
        document.addEventListener("DOMContentLoaded", function() {
            let savedData = JSON.parse(localStorage.getItem('latestFeedback'));
            if (savedData) {
                document.getElementById('displayTopic').textContent = savedData.topic;
                document.getElementById('displayName').textContent = savedData.name;
                document.getElementById('displayEmail').textContent = savedData.email;
                document.getElementById('displaySentiment').textContent = savedData.sentiment;
                document.getElementById('displayMessage').textContent = savedData.message;
            }
        });
    </script>
</body>
</html>
