<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEPHRA — Let's Chat</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="feedback.css">
</head>

<body>

    <!-- NAVBAR -->
    <!-- MASTER NAVBAR SNIPPET -->
    <header class="navbar fixed-top">
    <div class="nav-wrap">

        <nav class="nav-left">
            <a href="index.html" class="nav-item">Home</a>
            <a href="history.html" class="nav-item">History</a>
            <a href="feedback.html" class="nav-item active">Feedback</a>
            <a href="contact.html" class="nav-item">Contact</a>
        </nav>

        <a href="index.html" class="nav-brand">Zephra</a>

        <div class="nav-right">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Search guides...">
                <div class="search-btn"></div>
            </div>
            <a href="signin.html" class="nav-item">Sign In</a>
            <a href="saved.html" class="nav-item">Saved</a>
        </div>

    </div>
</header>

    <!-- MAIN CONTENT -->
    <main class="container py-5 my-3">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">

                <!-- Warm Header -->
                <div class="feedback-header mb-5 text-center text-md-start">
                    <div class="page-eyebrow mb-2">Community Notes</div>
                    <h1 class="page-title mb-3">Help us get every detail right.</h1>
                </div>

                <!-- Form Card -->
                <div class="feedback-card p-4 p-md-5">

                    <!-- Dynamic Alert Banner -->
                    <div id="thankYouMessage" class="alert alert-success border-0 mb-4 d-none">
                        <div class="fw-semibold fs-5 mb-1">Thanks for sharing!</div>
                        <div>Your note has been sent to our team. We'll follow up if we have any quick questions.</div>
                    </div>

                    <form id="FeedbackForm">

                        <!-- Topic Pills instead of boring dropdowns -->
                        <div class="mb-4">
                            <label class="form-label d-block">What are we talking about today?</label>
                            <div class="topic-pills-wrapper d-flex flex-wrap gap-2 pt-1">
                                <label class="topic-pill">
                                    <input type="radio" name="topic" value="technique" checked>
                                    <span>Technique Correction</span>
                                </label>
                                <label class="topic-pill">
                                    <input type="radio" name="topic" value="history">
                                    <span>History / Timeline Detail</span>
                                </label>
                                <label class="topic-pill">
                                    <input type="radio" name="topic" value="idea">
                                    <span>Guide Suggestion</span>
                                </label>
                                <label class="topic-pill">
                                    <input type="radio" name="topic" value="hello">
                                    <span>Just saying hi</span>
                                </label>
                            </div>
                        </div>

                        <!-- Name & Email -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="userName" class="form-label">What should we call you?</label>
                                <input type="text" class="form-control" id="userName"
                                    placeholder="e.g. Lin Dan or Coach Dave" required>
                            </div>
                            <div class="col-md-6">
                                <label for="userEmail" class="form-label">Where can we reply?</label>
                                <input type="email" class="form-control" id="userEmail"
                                    placeholder="your.email@domain.com" required>
                            </div>
                        </div>

                        <!--Question-->
                        <div class="mb-4">
                            <label for="userMessage" class="form-label">What's on your mind?</label>
                            <textarea class="form-control" id="userMessage" rows="5"
                                placeholder="Share your thoughts, suggestions, or corrections here..."
                                required></textarea>
                        </div>

                        <!--Mood Indicator -->
                        <div class="mb-5 align-items-center">
                            <label class="form-label d-block">How are you finding the site experience so far?</label>
                            <div class="sentiment-group d-flex gap-2">
                                <label class="sentiment-btn">
                                    <input type="radio" name="sentiment" value="loving-it" checked>
                                    <span>Loving it</span>
                                </label>
                                <label class="sentiment-btn">
                                    <input type="radio" name="sentiment" value="getting-there">
                                    <span>It's decent</span>
                                </label>
                                <label class="sentiment-btn">
                                    <input type="radio" name="sentiment" value="needs-work">
                                    <span>Needs work</span>
                                </label>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-flex align-items-center justify-content-between pt-2 border-top">
                            <button type="submit" class="btn btn-primary px-4 py-3">Send Note</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('humanFeedbackForm').addEventListener('submit', function (e) {
            e.preventDefault();
            this.classList.add('d-none');
            document.getElementById('thankYouMessage').classList.remove('d-none');
        });
    </script>
</body>

</html>
