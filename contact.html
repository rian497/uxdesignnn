<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEPHRA — Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Karla', sans-serif;
            line-height: 1.6;
            background: #F3F0E7;
            color: #1D2620;
            min-height: 100vh;
            padding-top: 80px;
        }

        /* ---------- NAVBAR (unchanged system) ---------- */

        .navbar {
            padding: 15px 30px;
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #FFFFFF;
            z-index: 1000;
            border-bottom: 1px solid #DCD7C7;
            box-sizing: border-box;
        }

        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            line-height: 1.1;
        }

        .nav-center .brand {
            font-weight: 600;
            font-size: 28px;
            color: #16382C;
            font-family: 'Fraunces', serif;
            font-style: italic;
        }
        .navbar a {
            text-decoration: none;
            color: #16382C;
            font-size: 13.5px;
            font-weight: 600;
            position: relative;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #BE5B33;
            transition: width 0.3s ease;
        }

        .navbar a:hover::after { width: 100%; }
        .navbar a:hover { color: #954726; }

        .navbar a.active::after { width: 100%; background: #16382C; }
        .navbar a.active { color: #16382C; }

        .selector {
            align-items: center;
            font-size: 13px;
            color: #16382C;
            position: relative;
            font-family: 'Karla', sans-serif;
        }

        .selector select {
            border: none;
            background: transparent;
            font-size: 12px;
            font-family: 'Karla', sans-serif;
            color: #16382C;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding: 5px 20px 5px 10px;
            cursor: pointer;
        }

        .selector select:focus { outline: none; }

        .selector::after {
            content: "▾";
            position: absolute;
            right: 10px;
            font-size: 10px;
            pointer-events: none;
            color: #5B6259;
        }

        .icon-group a {
            font-family: 'Karla', sans-serif;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.3px;
            color: #16382C;
        }

        .icon-group a:hover { color: #954726; }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            height: 40px;
        }

        .search-input {
            width: 0;
            height: 36px;
            padding: 8px 12px;
            border: 2px solid #16382C;
            border-radius: 20px;
            font-size: 13px;
            font-family: 'Karla', sans-serif;
            background: white;
            color: #1D2620;
            outline: none;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0;
            transform: translateX(40px);
        }

        .search-input::placeholder { color: #A8A392; }

        .search-icon {
            position: absolute;
            right: 0;
            width: 36px;
            height: 36px;
            background: #16382C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 2;
        }

        .search-icon:before { content: '🔍'; font-size: 15px; }

        .search-container:hover .search-input {
            width: 200px;
            opacity: 1;
            transform: translateX(0);
            padding-right: 50px;
        }

        .search-container:hover .search-icon { background: #954726; }
        .search-input:focus { border-color: #BE5B33; }

        /* ---------- CONTACT: PAGE TITLE ---------- */

        .page-title-wrap {
            text-align: center;
        }

        .page-title {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 46px;
            color: #16382C;
        }

        /* ---------- CONTACT: FORM CARD ---------- */

        .contact-card {
            background: #FFFFFF;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(22, 56, 44, 0.08);
            padding: 46px;
            border-top: 3px solid #BE5B33;
        }

        .form-label {
            font-family: 'Karla', sans-serif;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: #5B6259;
            margin-bottom: 8px;
        }

        .form-control {
            border: 1px solid #DCD7C7;
            border-radius: 4px;
            padding: 14px 16px;
            font-family: 'Karla', sans-serif;
            font-size: 15px;
            color: #1D2620;
            background: #FFFFFF;
        }

        .form-control::placeholder { color: #A8A392; }

        .form-control:focus {
            border-color: #BE5B33;
            box-shadow: 0 0 0 3px rgba(190, 91, 51, 0.12);
        }

        .btn-send {
            background: #954726;
            color: #FFFFFF;
            border: none;
            border-radius: 50px;
            padding: 14px 38px;
            font-family: 'Karla', sans-serif;
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            background: #16382C;
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        .btn-send:disabled {
            background: #A8A392;
            transform: none;
            cursor: not-allowed;
        }

        .field-error {
            font-size: 12.5px;
            color: #954726;
            margin-top: 6px;
            display: none;
        }

        .field-error.show { display: block; }

        .form-status {
            display: none;
            margin-bottom: 24px;
            padding: 14px 18px;
            border-radius: 4px;
            font-size: 14.5px;
        }

        .form-status.show { display: block; }

        .form-status.success {
            background: #EAF1EC;
            color: #16382C;
            border-left: 3px solid #2F5C46;
        }

        @media (max-width: 860px) {
            .page-title { font-size: 32px; }
            .contact-card { padding: 30px 24px; }
        }
    </style>
</head>
<body>
    <div class="navbar d-flex justify-content-between align-items-center">
        <div class="nav-left d-flex gap-3">
            <a href="index.html">Home</a>
            <a href="history.html">History</a>
            <a href="feedback.html">Feedback</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
        <div class="nav-center">
            <div class="brand">Zephra</div>
        </div>
        <div class="nav-right d-flex align-items-center gap-3">
            <div class="selector">
            </div>
            <div class="icon-group d-flex align-items-center gap-3">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search guides...">
                    <div class="search-icon"></div>
                </div>
                <a href="signin.html">Sign In</a>
                <a href="saved.html">Saved</a>
            </div>
        </div>
    </div>

    <!-- PAGE TITLE -->
    <div class="page-title-wrap container pt-5 pb-3">
        <h1 class="page-title">Contact</h1>
    </div>

    <!-- FORM -->
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="contact-card">
                    <div id="formStatus" class="form-status"></div>
                    <form id="contactForm" novalidate>
                        <div class="row mb-4">
                            <div class="col-md-6 mb-4 mb-md-0">
                                <label class="form-label" for="name">Name</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Your name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Email *</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                                <div class="field-error" id="emailError">Please enter a valid email address.</div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="phone">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Optional">
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="comment">Comment</label>
                            <textarea class="form-control" id="comment" name="comment" rows="5" placeholder="How can we help?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-send" id="sendBtn">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple client-side validation + submit handling.
        // Swap the fake delay in handleSubmit() for a real fetch() call to your backend/email service.
        const form = document.getElementById('contactForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const sendBtn = document.getElementById('sendBtn');
        const statusBox = document.getElementById('formStatus');

        function isValidEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = 'form-status show ' + type;
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const emailValid = isValidEmail(emailInput.value.trim());
            emailError.classList.toggle('show', !emailValid);
            emailInput.style.borderColor = emailValid ? '#DCD7C7' : '#954726';

            if (!emailValid) {
                statusBox.classList.remove('show');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            // Placeholder for a real request — replace with your endpoint.
            setTimeout(function () {
                showStatus("Thanks — we'll get back to you shortly.", 'success');
                form.reset();
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            }, 700);
        });

        emailInput.addEventListener('input', function () {
            if (emailError.classList.contains('show') && isValidEmail(emailInput.value.trim())) {
                emailError.classList.remove('show');
                emailInput.style.borderColor = '#DCD7C7';
            }
        });
    </script>
</body>
</html>
