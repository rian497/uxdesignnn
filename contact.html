<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEPHRA — Contact</title>
    
    <!-- Standardized Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Stylesheets -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <header class="navbar fixed-top">
        <div class="nav-wrap">

            <nav class="nav-left">
                <a href="index.html" class="nav-item">Home</a>
                <a href="history.html" class="nav-item">History</a>
                <a href="feedback.html" class="nav-item">Feedback</a>
                <a href="contact.html" class="nav-item active">Contact</a>
            </nav>

            <a href="index.html" class="nav-brand">Zephra</a>

            <div class="nav-right">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Search guides...">
                    <div class="search-btn"></div>
                </div>
                <a href="signin.html" class="nav-item">Sign In</a>
                <a href="saved.html" class="nav-item">Saved</a>
            </div>

        </div>
    </header>

    <!-- PAGE TITLE -->
    <div class="page-title-wrap container pt-5 pb-3">
        <h1 class="page-title">Contact us to get in touch with the Club</h1>
    </div>

    <!-- FORM -->
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="contact-card">
                    <div id="formStatus" class="form-status"></div>
                    <form id="contactForm" novalidate>
                        <div class="row mb-4">
                            <div class="col-md-6 mb-4 mb-md-0">
                                <label class="form-label" for="name">Name</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Your name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Email *</label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="you@example.com" required>
                                <div class="field-error" id="emailError">Please enter a valid email address.</div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="phone">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Optional">
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="comment">Comment</label>
                            <textarea class="form-control" id="comment" name="comment" rows="5"
                                placeholder="How can we help?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-send" id="sendBtn">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('contactForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const sendBtn = document.getElementById('sendBtn');
        const statusBox = document.getElementById('formStatus');

        function isValidEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = 'form-status show ' + type;
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const emailValid = isValidEmail(emailInput.value.trim());
            emailError.classList.toggle('show', !emailValid);
            emailInput.style.borderColor = emailValid ? '#DCD7C7' : '#954726';

            if (!emailValid) {
                statusBox.classList.remove('show');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            setTimeout(function () {
                showStatus("Thanks — we'll get back to you shortly.", 'success');
                form.reset();
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            }, 700);
        });

        emailInput.addEventListener('input', function () {
            if (emailError.classList.contains('show') && isValidEmail(emailInput.value.trim())) {
                emailError.classList.remove('show');
                emailInput.style.borderColor = '#DCD7C7';
            }
        });
    </script>
</body>

</html>
